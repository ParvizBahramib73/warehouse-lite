name: Deploy Warehouse Lite to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run tests
        run: npm test
      - name: Check JavaScript syntax
        run: |
          node --check src/domain.js
          node --check src/data.js
          node --check src/backup.js
          node --check src/app.js
          node --check src/utils.js
          node --check src/jalali.js
          node --check src/rial-input.js
          node --check src/returns.js
          node --check sw.js
          node --check scripts/build.mjs
      - name: Build static PWA
        run: npm run build
      - name: Test, build and add isolated v0.2 preview
        run: |
          cd preview/v0.2
          npm test
          npm run build
          cd ../..
          mkdir -p dist/preview/v0.2
          cp -a preview/v0.2/dist/. dist/preview/v0.2/
          test -f dist/preview/v0.2/index.html
          test -f dist/preview/v0.2/sw.js
          test -f dist/preview/v0.2/icons/icon-192.png
          grep -q "warehouse-lite-feedback-preview-v02" dist/preview/v0.2/src/data.js
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist
          include-hidden-files: true

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
