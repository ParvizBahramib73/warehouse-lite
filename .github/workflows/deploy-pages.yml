name: Deploy Warehouse Lite to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run tests
        run: npm test
      - name: Check JavaScript syntax
        run: |
          node --check src/domain.js
          node --check src/data.js
          node --check src/backup.js
          node --check src/app.js
          node --check src/utils.js
          node --check sw.js
          node --check scripts/build.mjs
      - name: Build static PWA
        run: npm run build
      - name: Add isolated v0.2 preview to Pages artifact
        run: |
          echo "3ae36e472e18a0512471c545900774e809c2cbe0814cec92c1c431afff905169  preview/v0.2/site.tar.xz" | sha256sum --check
          mkdir -p dist/preview/v0.2
          tar -xJf preview/v0.2/site.tar.xz -C dist/preview/v0.2
          cp -R dist/icons dist/preview/v0.2/icons
          test -f dist/preview/v0.2/index.html
          test -f dist/preview/v0.2/src/app.js
          test -f dist/preview/v0.2/icons/icon-192.png
          grep -q "warehouse-lite-feedback-preview-v02" dist/preview/v0.2/src/data.js
          for file in dist/preview/v0.2/src/*.js dist/preview/v0.2/sw.js; do node --check "$file"; done
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist
          include-hidden-files: true

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
