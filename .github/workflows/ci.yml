name: Quality checks

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Unit tests
        run: npm test
      - name: JavaScript syntax
        run: |
          node --check src/domain.js
          node --check src/data.js
          node --check src/backup.js
          node --check src/app.js
          node --check src/utils.js
          node --check sw.js
          node --check scripts/build.mjs
      - name: Build static PWA
        run: npm run build
      - name: Verify v0.2 preview package
        run: |
          echo "3ae36e472e18a0512471c545900774e809c2cbe0814cec92c1c431afff905169  preview/v0.2/site.tar.xz" | sha256sum --check
          mkdir -p preview-check
          tar -xJf preview/v0.2/site.tar.xz -C preview-check
          test -f preview-check/index.html
          test -f preview-check/manifest.webmanifest
          grep -q "warehouse-lite-feedback-preview-v02" preview-check/src/data.js
          for file in preview-check/src/*.js preview-check/sw.js; do node --check "$file"; done
      - name: Verify deploy output
        run: test -f dist/index.html && test -f dist/sw.js && test -f dist/manifest.webmanifest && test -f dist/.nojekyll
