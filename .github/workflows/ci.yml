name: Quality checks

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Unit tests
        run: npm test
      - name: JavaScript syntax
        run: |
          node --check src/domain.js
          node --check src/data.js
          node --check src/backup.js
          node --check src/app.js
          node --check src/utils.js
          node --check sw.js
          node --check scripts/build.mjs
      - name: Build static PWA
        run: npm run build
      - name: Verify deploy output
        run: test -f dist/index.html && test -f dist/sw.js && test -f dist/manifest.webmanifest && test -f dist/.nojekyll
